name: Mise en ligne

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          BASE: /carnet-de-classe/
          # Adresse et clé publique du projet Supabase. Cette clé est faite pour être visible :
          # la sécurité au niveau des lignes réserve chaque donnée à son compte.
          VITE_SUPABASE_URL: https://mjdrwnbzcwwalstacplf.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_za7_a22TMbFSSLVXlhCK8A_Gm6hCo9G
      # Les adresses internes de l'application (par exemple /seance/…) retombent sur la page d'accueil.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
